<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Terra Bite - สั่งอาหารเดลิเวอรี่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #fff1f2; }</style>
</head>
<body class="pb-28 text-slate-800">

    <!-- แถบแจ้งเตือนสถานะปิดร้าน (ซ่อนไว้โดยค่าเริ่มต้น จะแสดงเมื่อร้านปิด) -->
    <div id="store-closed-banner" class="bg-rose-600 text-white text-center py-3 px-4 font-bold text-sm shadow-md hidden sticky top-0 z-40 flex items-center justify-center gap-2">
        <i class="fas fa-store-slash text-lg"></i> ขออภัย! ขณะนี้ร้านปิดรับออเดอร์เดลิเวอรี่ชั่วคราว
    </div>

    <header class="bg-rose-600 text-white shadow-md sticky top-0 z-30 pt-4 pb-3 rounded-b-2xl">
        <div class="px-4 max-w-md mx-auto">
            <h1 class="text-xl font-bold mb-3">Terra Bite Delivery</h1>
            <div class="bg-white/20 p-2 rounded-xl flex items-center gap-2 text-sm cursor-pointer" onclick="openAddressModal()">
                <i class="fas fa-map-marker-alt"></i>
                <div class="flex-1 truncate">
                    <p class="font-bold text-xs opacity-80">จัดส่งไปที่</p>
                    <p class="truncate" id="display-address">กรุณาระบุที่อยู่จัดส่ง...</p>
                </div>
                <i class="fas fa-chevron-right text-xs"></i>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-4" id="menu-container">
        <div class="text-center py-10 text-rose-300"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>กำลังโหลดเมนู...</p></div>
    </main>

    <!-- แถบตะกร้าสินค้า (เดลิเวอรี่) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_15px_rgba(0,0,0,0.1)] rounded-t-3xl transition-transform duration-300 transform translate-y-full z-30">
        <div class="max-w-md mx-auto px-6 py-4">
            <div class="flex justify-between items-center mb-3 text-sm">
                <span class="text-slate-500">ค่าอาหาร</span>
                <span class="font-medium">฿<span id="cart-subtotal">0</span></span>
            </div>
            <div class="flex justify-between items-center mb-3 text-sm text-rose-500">
                <span>ค่าจัดส่ง (กม. ละ 5 บาท)</span>
                <span class="font-medium">+ ฿<span id="cart-delivery">0</span></span>
            </div>
            <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                <div>
                    <p class="text-xs text-slate-500 font-medium">ยอดชำระสุทธิ</p>
                    <p class="text-2xl font-bold text-rose-600">฿<span id="cart-total">0</span></p>
                </div>
                <button onclick="openPaymentModal()" id="btn-checkout" class="bg-rose-600 text-white px-6 py-3 rounded-xl font-bold shadow-md shadow-rose-200">
                    ชำระเงิน <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal กรอกที่อยู่ -->
    <div id="address-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl p-6">
            <h3 class="font-bold text-lg mb-4">ข้อมูลการจัดส่ง</h3>
            <input type="text" id="cust-name" placeholder="ชื่อ-นามสกุล" class="w-full p-3 border rounded-xl mb-3 outline-none focus:border-rose-500">
            <input type="tel" id="cust-phone" placeholder="เบอร์โทรศัพท์" class="w-full p-3 border rounded-xl mb-3 outline-none focus:border-rose-500">
            <textarea id="cust-address" placeholder="บ้านเลขที่, ซอย, จุดสังเกต" rows="2" class="w-full p-3 border rounded-xl mb-4 outline-none focus:border-rose-500"></textarea>
            <button onclick="saveAddress()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">ยืนยันที่อยู่</button>
        </div>
    </div>

    <!-- Modal ชำระเงิน -->
    <div id="payment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white w-11/12 max-w-sm rounded-3xl p-6 text-center">
            <h3 class="font-bold text-lg mb-2">สแกนชำระเงิน</h3>
            <p class="text-sm text-slate-500 mb-4">ระบบจะยืนยันออเดอร์อัตโนมัติเมื่อโอนสำเร็จ</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=MockPayment" class="mx-auto w-48 h-48 mb-4 border p-2 rounded-xl">
            <button onclick="simulatePaymentSuccess()" class="w-full bg-rose-600 text-white py-3 rounded-xl font-bold shadow-md">จำลองการจ่ายเงินสำเร็จ</button>
            <button onclick="closePaymentModal()" class="w-full text-slate-500 py-3 mt-2 text-sm font-medium">ยกเลิก</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPT (Delivery Customer Page) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, orderBy, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsgcKhn0V1lYjF754aypxZv5C-PmHCvno",
            authDomain: "mobile-first-5543c.firebaseapp.com",
            projectId: "mobile-first-5543c",
            storageBucket: "mobile-first-5543c.firebasestorage.app",
            messagingSenderId: "375984636440",
            appId: "1:375984636440:web:685692699c3320e201f96d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];
        let deliveryInfo = { name: '', phone: '', address: '', fee: 40 };
        let isStoreOpen = true;

        // 1. ตรวจสอบสถานะเปิด/ปิดร้านแบบ Real-time จาก Firebase
        onSnapshot(doc(db, "settings", "shop"), (docSnap) => {
            if (docSnap.exists()) {
                isStoreOpen = docSnap.data().deliveryOpen ?? true;
                updateStoreStatusUI(isStoreOpen);
            }
        });

        function updateStoreStatusUI(isOpen) {
            const banner = document.getElementById('store-closed-banner');
            const cartBar = document.getElementById('cart-bar');
            
            if (!isOpen) {
                banner.classList.remove('hidden');
                cartBar.classList.add('translate-y-full'); // ซ่อนตะกร้า
            } else {
                banner.classList.add('hidden');
            }
            fetchMenus(); // โหลดเมนูใหม่เพื่อให้ปุ่มกดถูกปิดใช้งาน/เป็นสีเทา
        }

        // 2. โหลดเมนู (ถ้าปิดร้าน เมนูจะเปลี่ยนเป็นสีเทาและกดสั่งไม่ได้)
        async function fetchMenus() {
            const container = document.getElementById('menu-container');
            const q = query(collection(db, "menu_items"), orderBy("created_at", "desc"));
            const querySnapshot = await getDocs(q);
            container.innerHTML = '';

            querySnapshot.forEach((docSnap) => {
                const item = docSnap.data();
                
                // กำหนดสไตล์เมื่อร้านปิด (สีเทา โปร่งแสง และปุ่มกดไม่ได้)
                const opacityStyle = !isStoreOpen ? 'opacity-50 grayscale bg-slate-100' : 'bg-white';
                const buttonHTML = !isStoreOpen 
                    ? `<button disabled class="px-4 py-1.5 rounded-full bg-slate-200 text-slate-400 font-medium text-sm cursor-not-allowed">ปิดรับออเดอร์</button>`
                    : `<button onclick="window.addToCart('${item.name}', ${item.price})" class="px-4 py-1.5 rounded-full bg-rose-50 text-rose-600 font-medium text-sm hover:bg-rose-100">เพิ่ม</button>`;

                container.innerHTML += `
                    <div class="${opacityStyle} rounded-2xl p-3 flex gap-4 mb-4 shadow-sm border border-rose-50 transition-all">
                        <img src="${item.img}" class="w-24 h-24 rounded-xl object-cover">
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div><h3 class="font-bold text-slate-800">${item.name}</h3></div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="font-bold text-rose-600">฿${item.price}</span>
                                ${buttonHTML}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.addToCart = (name, price) => {
            if (!isStoreOpen) {
                alert('ขออภัย ร้านปิดรับออเดอร์เดลิเวอรี่ชั่วคราว');
                return;
            }
            const existing = cart.find(i => i.name === name);
            if (existing) existing.qty += 1;
            else cart.push({ name, price, qty: 1 });
            updateCartUI();
        };

        function updateCartUI() {
            if (!isStoreOpen) return;
            const bar = document.getElementById('cart-bar');
            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const total = subtotal + deliveryInfo.fee;
            
            document.getElementById('cart-subtotal').innerText = subtotal;
            document.getElementById('cart-delivery').innerText = cart.length > 0 ? deliveryInfo.fee : 0;
            document.getElementById('cart-total').innerText = cart.length > 0 ? total : 0;
            
            cart.length > 0 ? bar.classList.remove('translate-y-full') : bar.classList.add('translate-y-full');
        }

        window.openAddressModal = () => document.getElementById('address-modal').classList.remove('hidden');
        window.saveAddress = () => {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            if(!name || !phone || !address) return alert('กรอกข้อมูลให้ครบถ้วน');
            deliveryInfo.name = name;
            deliveryInfo.phone = phone;
            deliveryInfo.address = address;
            document.getElementById('display-address').innerText = address;
            document.getElementById('address-modal').classList.add('hidden');
        };

        window.openPaymentModal = () => {
            if (!isStoreOpen) return alert('ขออภัย ร้านปิดรับออเดอร์เดลิเวอรี่แล้ว');
            if(!deliveryInfo.address) return openAddressModal();
            document.getElementById('payment-modal').classList.remove('hidden');
        };
        window.closePaymentModal = () => document.getElementById('payment-modal').classList.add('hidden');

        window.simulatePaymentSuccess = async () => {
            if (!isStoreOpen) return alert('ขออภัย ร้านปิดรับออเดอร์เดลิเวอรี่แล้ว');
            document.getElementById('payment-modal').classList.add('hidden');
            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            try {
                await addDoc(collection(db, "orders"), {
                    type: "delivery",
                    customer: `${deliveryInfo.name} (${deliveryInfo.phone})`,
                    address: deliveryInfo.address,
                    deliveryFee: deliveryInfo.fee,
                    items: cart,
                    total: subtotal + deliveryInfo.fee,
                    status: "รอยืนยัน",
                    timestamp: serverTimestamp()
                });
                alert('ชำระเงินสำเร็จ! ออเดอร์ถูกส่งไปยังร้านค้าแล้ว');
                cart = [];
                updateCartUI();
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        setTimeout(() => openAddressModal(), 500);
    </script>
</body>
</html>
